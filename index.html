<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Bee:Screw</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3f8; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      #sbh-probe { position: fixed; top: 0; left: 0; width: 1px; visibility: hidden; pointer-events: none;
        height: max(var(--sbh, 0px), env(safe-area-inset-top, 0px)); }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>
    <canvas id="view"></canvas>
    <canvas id="game"></canvas>
    <canvas id="fx" style="pointer-events:none"></canvas>
    <div id="sbh-probe"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
